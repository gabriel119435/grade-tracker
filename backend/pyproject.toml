[project]
name = "grade-tracker-backend"
version = "0.1.0"
description = "flask backend for grade-tracker: teachers record student grades by date, students view their history"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# pytest looks in tests/ for files named test_*.py or *_test.py and runs their test_* functions
testpaths = ["tests"]
pythonpath = ["."]
