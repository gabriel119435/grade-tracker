# nginx: $name reads a built-in variable, filled per request (client ip, path, ...)
# limit_req_zone and limit_conn_zone are used to define limits in request frequency and connection count
#
# limit_req_zone <row id> zone=<table name>:<table size> rate=<max speed per row>
# defines a table of request counters in memory, limit_req uses it later by name to slow down or reject requests:
# +-------------------------------------------+
# |             table name example            |
# +-----------------------+-------------------+
# | row id (as client ip) | row value         |
# +-----------------------+-------------------+
# | 203.0.113.7           | 9 recent requests |
# | 198.51.100.4          | 2 recent requests |
# +-----------------------+-------------------+

# one row for all clients ($server_name doesn't change per request), 100 requests per second in total
limit_req_zone $server_name zone=global_limit:1m rate=100r/s;

# one row per client ip ($binary_remote_addr is the client ip as raw bytes), 10 requests per second each
limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/s;

# one row per client ip, 4 login attempts per minute each, one every 15s, against password guessing
limit_req_zone $binary_remote_addr zone=login_limit:1m rate=4r/m;

# one row per client ip, open connections at this moment, the cap is set in location /api/
limit_conn_zone $binary_remote_addr zone=conn_limit:1m;

server {
    listen 80;

    # server header and nginx error pages say just "nginx", without the version
    server_tokens off;

    # sets variable root only, shared by every location below
    root /usr/share/nginx/html;

    # x-frame-options deny: this response may never be shown inside a frame (clickjacking guard)
    # always: sent on http errors too
    # a location with its own add_header drops this one, nginx doesn't merge them, so those repeat it
    add_header x-frame-options deny always;

    # behind the cloudflare tunnel every request comes from cloudflared, per-ip limits would see one ip for everyone
    # cf-connecting-ip holds the visitor ip set by cloudflare, trusted only on connections from cloudflared
    # disabled until cloudflared's address is known: replace CLOUDFLARED_IP with it and uncomment both lines
    # set_real_ip_from CLOUDFLARED_IP;
    # real_ip_header cf-connecting-ip;

    # location /api/: handles paths starting with /api/, the longest matching prefix wins, not file order
    # applies the limits below, then forwards to flask
    location /api/ {
        # all clients: 1+50 slots, used slots free one at a time every 10ms, so a full bucket takes 500ms to empty
        # rejection is answered with limit_req_status (default is 503, changed below)
        # ex: 60 requests in the same instant -> 51 forwarded, 9 get 429
        # ex: 20ms later 10 requests arrive -> 2 forwarded (2 freed slots), 8 get 429
        limit_req zone=global_limit burst=50 nodelay;

        # per ip: 20 slots, each frees when its request finishes. rejection uses limit_conn_status (default 503)
        # ex: while 20 requests from one ip are not answered yet, new ones from that ip get 503
        limit_conn conn_limit 20;

        # per ip: same as all clients, with 1+20 slots freeing one at a time every 100ms
        # delay=10: the first 10 extra go at once, the next 10 wait for a slot to free instead of being rejected
        # ex: 25 requests in the same instant -> 11 forwarded, 10 released one per 100ms (1s total), 4 get 429
        # ex: 1.3s later 20 more arrive -> 13 slots freed, 3 forwarded, 10 wait 1400ms to 2300ms (1s total), 7 get 429
        limit_req zone=api_limit burst=20 delay=10;

        # limit_req rejects with 429 too many requests instead of its default 503 service unavailable
        limit_req_status 429;

        # docker compose service name
        proxy_pass http://flask-backend:5000;
    }

    # exact match wins over the /api/ prefix, so login gets only the limits listed here
    location = /api/login {
        # no burst: a try sooner than 15s after the last accepted one gets 429
        limit_req zone=login_limit;
        limit_req zone=global_limit burst=50 nodelay;
        limit_conn conn_limit 20;
        limit_req_status 429;
        proxy_pass http://flask-backend:5000;
    }

    # built js/css: the name changes with the content so a cached copy is never stale
    # 31536000s = 1y, http has no forever value and 1y is the convention for it
    # missing file gets an honest 404 instead of index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header x-frame-options deny always;
        try_files $uri =404;
    }

    # shortest prefix: every path no longer prefix took, the built vue app
    location / {
        # no-cache: the browser keeps a copy but re-checks it on every load, so index.html is never stale
        add_header Cache-Control "no-cache";
        add_header x-frame-options deny always;

        # $uri: try to serve exact file from root (/favicon.svg serves root/favicon.svg)
        # ex: /teacher/grades isn't a file, so index.html loads and vue reads the url to show the grades page
        try_files $uri /index.html;
    }

    # 429 from limit_req, limit_req_status set explicitly
    # 503 from limit_conn, its default status, no limit_conn_status set
    # 404 from try_files in /assets/
    # 502 from proxy_pass in /api/ when flask is unreachable (down, restarting, crashed)
    # 504 from proxy_pass in /api/ when flask doesn't answer within proxy_read_timeout (default 60s)
    # 413 from a request body bigger than client_max_body_size (default 1m)
    # 494 from headers bigger than nginx's buffers (huge cookies), the client sees it as 400
    # 405 from a method other than GET or HEAD on a static file, like POST /
    # 500 from an internal nginx failure

    # garbage request lines (bad verb, path or http version) get nginx's html 400 or 505, they can't be routed to json

    # error_page <status> <target>: replaces the response nginx itself would send with that status by the target's
    # set at server level, it applies to every location in this server. flask's own errors pass through untouched
    # the @ prefix marks a named internal location, only reachable from inside nginx, never from a url
    error_page 429 @rate_limited;
    error_page 503 @server_full;
    error_page 404 @not_found;
    error_page 502 @bad_gateway;
    error_page 504 @gateway_timeout;
    error_page 413 @body_too_large;
    error_page 494 @bad_request;
    error_page 405 @method_not_allowed;
    error_page 500 @internal_error;

    location @rate_limited {
        # clears the url-extension:content-type map, so an error on x.js is answered as json
        types {}
        default_type application/json;
        return 429 '{"error": "too_many_requests"}';
    }

    location @server_full {
        types {}
        default_type application/json;
        return 503 '{"error": "server_busy"}';
    }

    location @not_found {
        types {}
        default_type application/json;
        return 404 '{"error": "not_found"}';
    }

    location @bad_gateway {
        types {}
        default_type application/json;
        return 502 '{"error": "server_unavailable"}';
    }

    location @gateway_timeout {
        types {}
        default_type application/json;
        return 504 '{"error": "server_timeout"}';
    }

    location @body_too_large {
        types {}
        default_type application/json;
        return 413 '{"error": "request_too_large"}';
    }

    location @bad_request {
        types {}
        default_type application/json;
        return 400 '{"error": "bad_request"}';
    }

    location @method_not_allowed {
        types {}
        default_type application/json;
        return 405 '{"error": "method_not_allowed"}';
    }

    location @internal_error {
        types {}
        default_type application/json;
        return 500 '{"error": "internal_server_error"}';
    }
}
